<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Laravel Sanctum reads the bearer token from the Authorization header.
    # Apache only forwards it to the application when it is mapped into the
    # environment like this. (CGIPassAuth is deliberately not used: it is not
    # permitted in <VirtualHost> context and Apache refuses to start.)
    SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
